<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascension V2.0 // PROJECT REBIRTH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neon-blue': '#00f3ff',
                        'neon-pink': '#ff00ff',
                        'neon-purple': '#bd00ff',
                        'neon-green': '#00ff41',
                        'dark-bg': '#050510',
                        'panel-bg': '#0f0f1f',
                    },
                    fontFamily: {
                        'cyber': ['Courier New', 'monospace'], // Placeholder until fonts load
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap');

        body {
            background-color: #050510;
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
        }

        .font-mono {
            font-family: 'Share Tech Mono', monospace;
        }

        /* CRT Effect */
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 9999;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(255, 255, 255, 0.04) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 10s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% {
                bottom: 100%;
            }

            100% {
                bottom: -100px;
            }
        }
    </style>
</head>

<body class="h-screen flex flex-col items-center justify-center relative">

    <div class="scanline"></div>

    <!-- Main Container -->
    <div id="app" class="w-full h-full max-w-7xl mx-auto relative z-10">
        <!-- JS will render UI here -->
        <div class="flex items-center justify-center h-full">
            <h1 class="text-4xl text-neon-blue font-mono tracking-widest animate-pulse">LOADING SYSTEM...</h1>
        </div>
    </div>

</body>

</html>
